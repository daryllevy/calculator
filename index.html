<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="calculator">
      <div class="screen">0</div>
      <div class="buttons">
        <div class="for-suppression">
          <button class="clear">clear</button>
          <button class="delete">delete</button>
        </div>

        <div class="for-operations">
          <div class="digits">
            <button class="digit-7">7</button>
            <button class="digit-8">8</button>
            <button class="digit-9">9</button>
            <button class="digit-4">4</button>
            <button class="digit-5">5</button>
            <button class="digit-6">6</button>
            <button class="digit-1">1</button>
            <button class="digit-2">2</button>
            <button class="digit-3">3</button>
            <button class="dot">.</button>
            <button class="digit-zero">0</button>
            <button class="equal">=</button>
          </div>

          <div class="operators">
            <div class="division">/</div>
            <div class="multiplication">x</div>
            <div class="sustraction">-</div>
            <div class="addition">+</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
