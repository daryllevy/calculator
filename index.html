<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="calculator">
        <div class="toScreen">
          <div class="display"></div>
          <div class="screen">0</div>
        </div>
        <div class="buttons">
          <div class="for-suppression">
            <button class="clear">clear</button>
            <button class="delete">delete</button>
          </div>

          <div class="for-operations">
            <div class="digits">
              <button class="digit digit-7">7</button>
              <button class="digit digit-8">8</button>
              <button class="digit digit-9">9</button>
              <button class="digit digit-4">4</button>
              <button class="digit digit-5">5</button>
              <button class="digit digit-6">6</button>
              <button class="digit digit-1">1</button>
              <button class="digit digit-2">2</button>
              <button class="digit digit-3">3</button>
              <button class="digit dot">.</button>
              <button class="digit digit-zero">0</button>
              <button class="equal">=</button>
            </div>

            <div class="operators">
              <button class="op division">/</button>
              <button class="op multiplication">x</button>
              <button class="op sustraction">-</button>
              <button class="op addition">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
