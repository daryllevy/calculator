<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="calculator">
      <div class="screen">12 + 5</div>
      <div class="buttons">
        <div class="for-suppression">
          <button class="clear">clear</button>
          <button class="delete">delete</button>
        </div>

        <div class="for-operations">
          <div class="digits">
            <div class="digit-7">7</div>
            <div class="digit-8">8</div>
            <div class="digit-9">9</div>
            <div class="digit-4">4</div>
            <div class="digit-5">5</div>
            <div class="digit-6">6</div>
            <div class="digit-1">1</div>
            <div class="digit-2">2</div>
            <div class="digit-3">3</div>
            <div class="dot">.</div>
            <div class="digit-zero">0</div>
            <div class="equal">=</div>
          </div>

          <div class="operators">
            <div class="division">/</div>
            <div class="multiplication">x</div>
            <div class="sustraction">-</div>
            <div class="addition">+</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
